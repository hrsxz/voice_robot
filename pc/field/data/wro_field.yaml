# WRO 练习场地 (Übungsspielfeld), Starter 每年都用这块场地垫。
#
# 坐标系 (openspec/changes/vision-field-model/design.md D1):
#   原点在场地垫左上角 (A 区所在的角), x 向右 0–236.2, y 向下 0–114.3, 单位厘米;
#   朝向 heading: 0° 指向 +x, 顺时针为正 (y 向下), 所以 90° 朝 +y (下), 180° 朝 -x (左), 270° 朝 -y (上)。
#
# 数据来源: docs/WRO/WRO2022-ST-Aufgaben.pdf 第 7 页的总览照片, 四角做透视矫正后测量
# (四个圆的半径在 x、y 方向都量出 5.0 cm, 说明矫正可信), 精度约 ±2 cm。
# 摄像头到货后用参考图核对 (vision-field-model 任务 3.3)。

version: 1

field:
  width_cm: 236.2
  height_cm: 114.3

# 场外 ArUco anchor 的中心 (pc/vision/extrinsics.py 读这一节): 贴在场地垫四个角外面的桌面上,
# marker 边长、朝向在 pc/config/vision.yaml。现在是计划的位置, 贴好后量实际位置再改。
anchors:
  10: {x_cm: -7, y_cm: -7}
  11: {x_cm: 243.2, y_cm: -7}
  12: {x_cm: 243.2, y_cm: 121.3}
  13: {x_cm: -7, y_cm: 121.3}

# 区域: 多边形 (不含黑色边框)。entries = 进入点: 小车 (转弯中心) 在这里、朝向 heading 时,
# 正前方就是这个区域, 放下物体时从进入点沿 heading 方向直线前进。
zones:
  A:
    color: yellow
    polygon: [[0, 0], [41.2, 0], [41.2, 13.4], [0, 13.4]]
    entries:
      - {x: 21.4, y: 32.0, heading: 270}
  B:
    color: green
    polygon: [[160.0, 0], [211.8, 0], [211.8, 14.0], [160.0, 14.0]]
    entries:
      - {x: 185.8, y: 32.0, heading: 270}
  C:
    color: blue
    polygon: [[223.6, 62.8], [236.2, 62.8], [236.2, 114.3], [223.6, 114.3]]
    entries:
      - {x: 205.0, y: 87.2, heading: 0}
  D:
    color: red
    polygon: [[63.2, 102.6], [173.6, 102.6], [173.6, 114.3], [63.2, 114.3]]
    entries:
      - {x: 166.0, y: 85.0, heading: 90}
      - {x: 71.4, y: 85.0, heading: 90}   # 在 D 区左边 (红色小人) 和第一个方格之间居中

# 起终点区: 左下角带黑框的白色区域 (印着 WRO 标志)。
# 小车 (车身 + 夹爪约 30 cm) 比起终点区宽 (约 26 cm), 所以停车 = 先到进入点 (车头朝东),
# 再倒车到 park: 车尾在起终点区里 (规则: 接触起终点区就算)。开局小车也停在 park。
start_area:
  polygon: [[0, 91.1], [25.9, 91.1], [25.9, 114.3], [0, 114.3]]
  entries:
    - {x: 45.0, y: 102.0, heading: 0}
  park: {x: 16.0, y: 102.0, heading: 0}

circles:
  green:  {center: [87.6, 37.5], radius: 5.0, entries: [{x: 87.6, y: 58.0, heading: 270}]}
  red:    {center: [103.7, 37.4], radius: 5.0, entries: [{x: 103.7, y: 58.0, heading: 270}]}
  blue:   {center: [120.2, 37.4], radius: 5.0, entries: [{x: 120.2, y: 58.0, heading: 270}]}
  yellow: {center: [136.0, 37.4], radius: 5.0, entries: [{x: 136.0, y: 58.0, heading: 270}]}

# 命名位置点 (场地垫上印的灰色方格等)。approach = 接近方向: 抓取这个位置上的物体时小车的朝向
# (靠墙或两边有东西的位置必须指定; 没有指定的位置和任意坐标由程序自动选择)。
positions:
  pos1: {x: 5.5, y: 33.8, approach: 180}    # 左边 1–4 号位: 从场地内侧沿支线朝墙接近
  pos2: {x: 5.5, y: 48.4, approach: 180}
  pos3: {x: 5.5, y: 63.1, approach: 180}
  pos4: {x: 5.5, y: 77.8, approach: 180}
  pos5: {x: 219.5, y: 42.4}                  # 5 号 (长条形标记)
  pos5_side: {x: 224.5, y: 42.4, approach: 0}  # 5 号旁边的方格
  d1: {x: 83.2, y: 98.5, approach: 90}       # D 区上方的 6 个方格 (从上方沿短支线接近)
  d2: {x: 97.8, y: 98.5, approach: 90}
  d3: {x: 112.2, y: 98.5, approach: 90}
  d4: {x: 126.6, y: 98.5, approach: 90}
  d5: {x: 140.9, y: 98.5, approach: 90}
  d6: {x: 155.2, y: 98.5, approach: 90}
  a_side: {x: 43.5, y: 8.5, approach: 240}   # A 区右边 (Starter 2022: 黄色小人); 贴墙、下方是障碍杆, 从右下方斜着接近
  a_below: {x: 9.5, y: 15.5, approach: 180}  # A 区下方
  b_below_left: {x: 163.3, y: 16.4, approach: 270}
  b_inner: {x: 193.0, y: 12.2, approach: 270}
  b_side: {x: 209.0, y: 16.5, approach: 270}  # B 区下方 (Starter 2022: 绿色小人)
  c_inner: {x: 225.0, y: 96.0, approach: 0}   # C 区里 (Starter 2022: 蓝色大人)
  d_left: {x: 60.0, y: 108.0, approach: 90}   # D 区左边 (Starter 2022: 红色小人)
  d_right: {x: 175.5, y: 104.0, approach: 90}
  barrier: {x: 43.5, y: 48.0}                 # 障碍杆的位置 (灰色长条)

# 物体目录: 类型、颜色、高度和底面半径 (估计值, 待实测), 默认目标 (Starter 2022 任务书)。
# 目标写法: zone:<A-D> / circle:<颜色> / start
objects:
  yellow_person: {type: small_person, color: yellow, height_cm: 7, radius_cm: 2.5, target: "zone:B"}
  green_person:  {type: small_person, color: green,  height_cm: 7, radius_cm: 2.5, target: "zone:B"}
  red_person:    {type: small_person, color: red,    height_cm: 7, radius_cm: 2.5, target: "zone:B"}
  blue_person:   {type: large_person, color: blue,   height_cm: 10, radius_cm: 3.5, target: "zone:B"}
  package_1:     {type: package, color: red, height_cm: 5, radius_cm: 3.0, target: "zone:D"}
  package_2:     {type: package, color: red, height_cm: 5, radius_cm: 3.0, target: "zone:D"}
  green_robot:   {type: service_robot, color: green,  height_cm: 5, radius_cm: 3.0, target: "circle:green"}
  red_robot:     {type: service_robot, color: red,    height_cm: 5, radius_cm: 3.0, target: "circle:red"}
  blue_robot:    {type: service_robot, color: blue,   height_cm: 5, radius_cm: 3.0, target: "circle:blue"}
  yellow_robot:  {type: service_robot, color: yellow, height_cm: 5, radius_cm: 3.0, target: "circle:yellow"}

# 道路网: 场地上的黑线 (路线点之间直线相连, 长度由坐标计算)
roads:
  nodes:
    a_top: [21.4, 13.4]       # 左边竖线 (A 区下方到起终点区)
    j_p1: [21.4, 33.8]
    j_p2: [21.4, 48.4]
    j_p3: [21.4, 63.1]
    j_p4: [21.4, 77.8]
    v1_bottom: [21.4, 91.1]
    e_p1: [9.4, 33.8]         # 1–4 号位的支线末端
    e_p2: [9.4, 48.4]
    e_p3: [9.4, 63.1]
    e_p4: [9.4, 77.8]
    box_corner: [25.9, 91.1]  # 起终点区黑框的右上角
    box_step: [25.9, 103.0]
    step_low: [38.0, 103.0]
    step_up: [38.0, 87.2]
    h_d1: [83.2, 87.2]        # 底部长横线和 D 区方格的支线
    h_d2: [97.8, 87.2]
    h_d3: [112.2, 87.2]
    h_d4: [126.6, 87.2]
    h_d5: [140.9, 87.2]
    h_d6: [155.2, 87.2]
    h_v2: [185.8, 87.2]
    h_c: [223.6, 87.2]
    s_d1: [83.2, 95.5]
    s_d2: [97.8, 95.5]
    s_d3: [112.2, 95.5]
    s_d4: [126.6, 95.5]
    s_d5: [140.9, 95.5]
    s_d6: [155.2, 95.5]
    v2_top: [185.8, 14.0]     # 右边竖线 (B 区下方到底部横线)
    j_p5: [185.8, 42.4]
    e_p5: [217.0, 42.4]
  edges:
    - [a_top, j_p1]
    - [j_p1, j_p2]
    - [j_p2, j_p3]
    - [j_p3, j_p4]
    - [j_p4, v1_bottom]
    - [j_p1, e_p1]
    - [j_p2, e_p2]
    - [j_p3, e_p3]
    - [j_p4, e_p4]
    - [v1_bottom, box_corner]
    - [box_corner, box_step]
    - [box_step, step_low]
    - [step_low, step_up]
    - [step_up, h_d1]
    - [h_d1, h_d2]
    - [h_d2, h_d3]
    - [h_d3, h_d4]
    - [h_d4, h_d5]
    - [h_d5, h_d6]
    - [h_d6, h_v2]
    - [h_v2, h_c]
    - [h_d1, s_d1]
    - [h_d2, s_d2]
    - [h_d3, s_d3]
    - [h_d4, s_d4]
    - [h_d5, s_d5]
    - [h_d6, s_d6]
    - [v2_top, j_p5]
    - [j_p5, h_v2]
    - [j_p5, e_p5]

# 只用于画图的线 (中间那条闭合曲线, 不和道路网相连)
curves:
  loop: [[55.1, 16.9], [54.5, 20.3], [57.9, 27.5], [58.4, 31.8], [56.3, 39.9], [53.1, 47.3],
         [52.9, 50.6], [58.8, 57.6], [65.0, 63.1], [78.6, 67.7], [92.2, 77.1], [99.8, 79.2],
         [111.0, 79.8], [121.4, 78.8], [139.0, 75.4], [158.2, 75.0], [165.8, 72.5], [170.5, 67.0],
         [170.3, 60.9], [164.5, 48.3], [167.1, 38.6], [164.2, 33.3], [158.9, 28.7], [153.2, 25.7],
         [148.0, 24.5], [138.4, 24.5], [133.3, 22.7], [127.4, 18.5], [120.0, 10.3], [113.7, 8.9],
         [91.6, 9.9], [80.1, 7.3], [73.0, 7.2], [61.4, 10.3], [57.6, 13.2], [55.1, 16.9]]

# 禁行区: 树和障碍杆的标准位置, 默认关闭 (启用后路线不能穿过)
keepouts:
  tree_pos1: {circle: {at: pos1, radius: 4.0}, enabled: false}
  tree_pos4: {circle: {at: pos4, radius: 4.0}, enabled: false}
  tree_d2: {circle: {at: d2, radius: 4.0}, enabled: false}
  tree_d5: {circle: {at: d5, radius: 4.0}, enabled: false}
  barrier: {polygon: [[41.0, 30.0], [46.0, 30.0], [46.0, 66.0], [41.0, 66.0]], enabled: false}
